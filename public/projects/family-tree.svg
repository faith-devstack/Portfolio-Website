<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="tree-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0D12" />
      <stop offset="100%" stop-color="#111620" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="750" fill="url(#tree-bg)" />

  <g transform="translate(80, 50)">
    <rect width="1040" height="650" rx="8" fill="#10151F" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
    
    <!-- Window Bar -->
    <rect width="1040" height="42" rx="8" fill="#161C28" />
    <circle cx="24" cy="21" r="5" fill="#EF4444" fill-opacity="0.6" />
    <circle cx="42" cy="21" r="5" fill="#EAB308" fill-opacity="0.6" />
    <circle cx="60" cy="21" r="5" fill="#22C55E" fill-opacity="0.6" />

    <rect x="290" y="8" width="460" height="26" rx="4" fill="#0A0D12" stroke="#FFFFFF" stroke-opacity="0.08" />
    <text x="520" y="25" fill="#717D91" font-family="monospace" font-size="11" text-anchor="middle">
      akinlemibola-family-tree.vercel.app · Interactive Genealogical Visualizer
    </text>

    <!-- Graph Header Bar -->
    <g transform="translate(36, 65)">
      <text x="0" y="20" fill="#F6F4EE" font-family="sans-serif" font-weight="600" font-size="18">
        Akinlemibola Lineage Graph
      </text>
      <text x="0" y="38" fill="#717D91" font-family="sans-serif" font-size="12">
        Multi-generational ancestral graph rendered with D3 hierarchical layouts
      </text>

      <!-- Zoom/Pan Controls -->
      <g transform="translate(850, 0)">
        <rect width="110" height="30" rx="4" fill="#192231" stroke="#FFFFFF" stroke-opacity="0.1" />
        <text x="25" y="20" fill="#2FA499" font-family="monospace" font-size="12">ZOOM: 100%</text>
      </g>
    </g>

    <!-- Node-Link Hierarchy Visualization Graph -->
    <g transform="translate(50, 150)">
      
      <!-- Connecting Bezier Curves -->
      <!-- Generation 1 to Generation 2 -->
      <path d="M 470 60 C 470 120, 240 120, 240 180" stroke="#2FA499" stroke-width="2" stroke-opacity="0.4" fill="none" />
      <path d="M 470 60 C 470 120, 700 120, 700 180" stroke="#2FA499" stroke-width="2" stroke-opacity="0.4" fill="none" />
      
      <!-- Generation 2 to Generation 3 -->
      <path d="M 240 240 C 240 300, 120 300, 120 360" stroke="#3B82F6" stroke-width="2" stroke-opacity="0.4" fill="none" />
      <path d="M 240 240 C 240 300, 360 300, 360 360" stroke="#3B82F6" stroke-width="2" stroke-opacity="0.4" fill="none" />
      <path d="M 700 240 C 700 300, 580 300, 580 360" stroke="#3B82F6" stroke-width="2" stroke-opacity="0.4" fill="none" />
      <path d="M 700 240 C 700 300, 820 300, 820 360" stroke="#3B82F6" stroke-width="2" stroke-opacity="0.4" fill="none" />

      <!-- Generation 1: Patriarch Node -->
      <g transform="translate(380, 20)">
        <rect width="180" height="60" rx="6" fill="#1A2332" stroke="#2FA499" stroke-width="1.5" />
        <circle cx="28" cy="30" r="14" fill="#2FA499" fill-opacity="0.2" />
        <text x="28" y="34" fill="#2FA499" font-family="monospace" font-size="11" text-anchor="middle">G1</text>
        <text x="52" y="28" fill="#F6F4EE" font-family="sans-serif" font-weight="600" font-size="13">Chief Akinlemibola</text>
        <text x="52" y="44" fill="#717D91" font-family="sans-serif" font-size="11">Patriarch · 1910–1988</text>
      </g>

      <!-- Generation 2: 2 Branch Nodes -->
      <g transform="translate(150, 180)">
        <rect width="180" height="60" rx="6" fill="#141C28" stroke="#FFFFFF" stroke-opacity="0.12" />
        <circle cx="28" cy="30" r="14" fill="#3B82F6" fill-opacity="0.2" />
        <text x="28" y="34" fill="#3B82F6" font-family="monospace" font-size="11" text-anchor="middle">G2</text>
        <text x="52" y="28" fill="#F6F4EE" font-family="sans-serif" font-weight="600" font-size="13">Oladipo Branch</text>
        <text x="52" y="44" fill="#717D91" font-family="sans-serif" font-size="11">Senior Branch · 1942</text>
      </g>

      <g transform="translate(610, 180)">
        <rect width="180" height="60" rx="6" fill="#141C28" stroke="#FFFFFF" stroke-opacity="0.12" />
        <circle cx="28" cy="30" r="14" fill="#3B82F6" fill-opacity="0.2" />
        <text x="28" y="34" fill="#3B82F6" font-family="monospace" font-size="11" text-anchor="middle">G2</text>
        <text x="52" y="28" fill="#F6F4EE" font-family="sans-serif" font-weight="600" font-size="13">Bamidele Branch</text>
        <text x="52" y="44" fill="#717D91" font-family="sans-serif" font-size="11">Junior Branch · 1948</text>
      </g>

      <!-- Generation 3: 4 Leaf Nodes -->
      <g transform="translate(40, 360)">
        <rect width="160" height="52" rx="4" fill="#111722" stroke="#FFFFFF" stroke-opacity="0.08" />
        <text x="14" y="22" fill="#F6F4EE" font-family="sans-serif" font-size="12" font-weight="500">Tunde &amp; Siblings</text>
        <text x="14" y="38" fill="#717D91" font-family="monospace" font-size="10">Generation 03</text>
      </g>

      <g transform="translate(280, 360)">
        <rect width="160" height="52" rx="4" fill="#111722" stroke="#FFFFFF" stroke-opacity="0.08" />
        <text x="14" y="22" fill="#F6F4EE" font-family="sans-serif" font-size="12" font-weight="500">Folake &amp; Siblings</text>
        <text x="14" y="38" fill="#717D91" font-family="monospace" font-size="10">Generation 03</text>
      </g>

      <g transform="translate(500, 360)">
        <rect width="160" height="52" rx="4" fill="#111722" stroke="#FFFFFF" stroke-opacity="0.08" />
        <text x="14" y="22" fill="#F6F4EE" font-family="sans-serif" font-weight="500">Dayo &amp; Siblings</text>
        <text x="14" y="38" fill="#717D91" font-family="monospace" font-size="10">Generation 03</text>
      </g>

      <g transform="translate(740, 360)">
        <rect width="160" height="52" rx="4" fill="#111722" stroke="#FFFFFF" stroke-opacity="0.08" />
        <text x="14" y="22" fill="#F6F4EE" font-family="sans-serif" font-size="12" font-weight="500">Sola &amp; Siblings</text>
        <text x="14" y="38" fill="#717D91" font-family="monospace" font-size="10">Generation 03</text>
      </g>

    </g>
  </g>
</svg>
