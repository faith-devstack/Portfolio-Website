<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="pace-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1115" />
      <stop offset="100%" stop-color="#161920" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#pace-bg)" />

  <g transform="translate(80, 50)">
    <rect width="1040" height="650" rx="8" fill="#13161D" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
    
    <!-- Window Bar -->
    <rect width="1040" height="42" rx="8" fill="#1A1E27" />
    <circle cx="24" cy="21" r="5" fill="#EF4444" fill-opacity="0.6" />
    <circle cx="42" cy="21" r="5" fill="#EAB308" fill-opacity="0.6" />
    <circle cx="60" cy="21" r="5" fill="#22C55E" fill-opacity="0.6" />

    <rect x="300" y="8" width="440" height="26" rx="4" fill="#0E1015" stroke="#FFFFFF" stroke-opacity="0.08" />
    <text x="520" y="25" fill="#7E8796" font-family="monospace" font-size="11" text-anchor="middle">
      dr-tee-frontend.onrender.com · PACE E-Commerce
    </text>

    <!-- App Header -->
    <g transform="translate(40, 65)">
      <text x="0" y="22" fill="#F6F4EE" font-family="sans-serif" font-weight="700" font-size="20" letter-spacing="1">PACE</text>
      <text x="58" y="22" fill="#2FA499" font-family="sans-serif" font-weight="300" font-size="14">STORE</text>

      <text x="240" y="20" fill="#F6F4EE" font-family="sans-serif" font-size="12">CATALOG</text>
      <text x="320" y="20" fill="#7E8796" font-family="sans-serif" font-size="12">COLLECTIONS</text>
      <text x="430" y="20" fill="#7E8796" font-family="sans-serif" font-size="12">ABOUT</text>

      <!-- Cart Icon -->
      <rect x="880" y="2" width="80" height="28" rx="4" fill="#1C212B" stroke="#FFFFFF" stroke-opacity="0.1" />
      <text x="920" y="20" fill="#2FA499" font-family="monospace" font-size="11" text-anchor="middle">CART (3)</text>
    </g>

    <!-- Catalog Grid -->
    <g transform="translate(40, 120)">
      
      <!-- Filter Bar -->
      <g transform="translate(0, 0)">
        <rect width="80" height="28" rx="3" fill="#2FA499" />
        <text x="40" y="18" fill="#0D0F11" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">All Items</text>

        <rect x="90" width="90" height="28" rx="3" fill="#181D26" stroke="#FFFFFF" stroke-opacity="0.08" />
        <text x="135" y="18" fill="#A8A398" font-family="sans-serif" font-size="11" text-anchor="middle">Footwear</text>

        <rect x="190" width="80" height="28" rx="3" fill="#181D26" stroke="#FFFFFF" stroke-opacity="0.08" />
        <text x="230" y="18" fill="#A8A398" font-family="sans-serif" font-size="11" text-anchor="middle">Apparel</text>
      </g>

      <!-- Products Grid (3 columns) -->
      <g transform="translate(0, 50)">
        
        <!-- Product 1 -->
        <g transform="translate(0, 0)">
          <rect width="300" height="400" rx="4" fill="#171B24" stroke="#FFFFFF" stroke-opacity="0.08" />
          <rect x="15" y="15" width="270" height="230" rx="4" fill="#0F1218" />
          <circle cx="150" cy="130" r="60" fill="#2FA499" fill-opacity="0.1" />
          <text x="150" y="135" fill="#2FA499" font-family="monospace" font-size="12" text-anchor="middle">PACE VELOCITY 01</text>
          
          <text x="18" y="275" fill="#F6F4EE" font-family="sans-serif" font-weight="600" font-size="15">Aero Performance Sneaker</text>
          <text x="18" y="295" fill="#7E8796" font-family="sans-serif" font-size="12">Footwear · Cushion Midsole</text>
          <text x="18" y="335" fill="#2FA499" font-family="sans-serif" font-weight="700" font-size="16">$145.00</text>
          <rect x="180" y="315" width="105" height="32" rx="3" fill="#2FA499" />
          <text x="232" y="335" fill="#0D0F11" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">Add to Cart</text>
        </g>

        <!-- Product 2 -->
        <g transform="translate(330, 0)">
          <rect width="300" height="400" rx="4" fill="#171B24" stroke="#FFFFFF" stroke-opacity="0.08" />
          <rect x="15" y="15" width="270" height="230" rx="4" fill="#0F1218" />
          <circle cx="150" cy="130" r="60" fill="#3B82F6" fill-opacity="0.1" />
          <text x="150" y="135" fill="#3B82F6" font-family="monospace" font-size="12" text-anchor="middle">PACE HOODIE TECH</text>
          
          <text x="18" y="275" fill="#F6F4EE" font-family="sans-serif" font-weight="600" font-size="15">Weatherproof Tech Fleece</text>
          <text x="18" y="295" fill="#7E8796" font-family="sans-serif" font-size="12">Apparel · Water Resistant</text>
          <text x="18" y="335" fill="#2FA499" font-family="sans-serif" font-weight="700" font-size="16">$98.00</text>
          <rect x="180" y="315" width="105" height="32" rx="3" fill="#2FA499" />
          <text x="232" y="335" fill="#0D0F11" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">Add to Cart</text>
        </g>

        <!-- Product 3 -->
        <g transform="translate(660, 0)">
          <rect width="300" height="400" rx="4" fill="#171B24" stroke="#FFFFFF" stroke-opacity="0.08" />
          <rect x="15" y="15" width="270" height="230" rx="4" fill="#0F1218" />
          <circle cx="150" cy="130" r="60" fill="#E2B170" fill-opacity="0.1" />
          <text x="150" y="135" fill="#E2B170" font-family="monospace" font-size="12" text-anchor="middle">PACE DUFFLE 40L</text>
          
          <text x="18" y="275" fill="#F6F4EE" font-family="sans-serif" font-weight="600" font-size="15">Tactical Commuter Duffle</text>
          <text x="18" y="295" fill="#7E8796" font-family="sans-serif" font-size="12">Gear · Cordura Nylon</text>
          <text x="18" y="335" fill="#2FA499" font-family="sans-serif" font-weight="700" font-size="16">$120.00</text>
          <rect x="180" y="315" width="105" height="32" rx="3" fill="#2FA499" />
          <text x="232" y="335" fill="#0D0F11" font-family="sans-serif" font-weight="600" font-size="11" text-anchor="middle">Add to Cart</text>
        </g>

      </g>
    </g>
  </g>
</svg>
